    SellerSuspended:
      name: SellerSuspended
      title: Seller suspended (consumed)
      summary: seller-inbound suspended a seller.
      description: "Consumed. `type` = `com.retailnetwork.partner.seller-inbound.seller.SellerSuspended`. Sets the seller SUSPENDED in SellerStatusView at `suspendedAt` (an older event is ignored), then suppresses every LIVE listing whose ownerRef is `sellerId` (reason OWNER_SUSPENDED, one ListingSuppressed each). A listing already SUPPRESSED keeps its higher reason."
      contentType: application/cloudevents+json
      tags:
        - name: seller-inbound
      payload:
        $ref: "#/components/schemas/SellerSuspendedIn"
      examples:
        - name: sellerSuspended
          summary: A seller was suspended.
          payload:
            specversion: "1.0"
            id: "3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1ca2"
            source: "/retailnetwork/seller-inbound"
            type: "com.retailnetwork.partner.seller-inbound.seller.SellerSuspended"
            subject: "seller-77"
            time: "2026-10-24T13:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:seller-inbound:events:SellerSuspended:v1"
            data:
              sellerId: "seller-77"
              suspendedAt: "2026-10-24T13:00:00Z"

    SellerReinstated:
      name: SellerReinstated
      title: Seller reinstated (consumed)
      summary: seller-inbound reinstated a suspended seller.
      description: "Consumed. `type` = `com.retailnetwork.partner.seller-inbound.seller.SellerReinstated`. Sets the seller ACTIVE in SellerStatusView at `reinstatedAt` (an older event is ignored), then restores every listing of the seller suppressed for OWNER_SUSPENDED (one ListingRestored each), unless its node is not sellable or its item discontinued: then the reason switches to that cause (one ListingSuppressed)."
      contentType: application/cloudevents+json
      tags:
        - name: seller-inbound
      payload:
        $ref: "#/components/schemas/SellerReinstatedIn"
      examples:
        - name: sellerReinstated
          summary: A seller was reinstated.
          payload:
            specversion: "1.0"
            id: "3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1ca3"
            source: "/retailnetwork/seller-inbound"
            type: "com.retailnetwork.partner.seller-inbound.seller.SellerReinstated"
            subject: "seller-77"
            time: "2026-10-25T09:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:seller-inbound:events:SellerReinstated:v1"
            data:
              sellerId: "seller-77"
              reinstatedAt: "2026-10-25T09:00:00Z"

    InboundShipmentReceived:
      name: InboundShipmentReceived
      title: Inbound shipment received (consumed)
      summary: seller-inbound closed the receipt of an inbound shipment.
      description: "Consumed. `type` = `com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived`. Creates, for each received item that has no listing of (item, `nodeId`, ownerRef = `sellerId`), the seller's listing (ListingCreated, availability 0 / UNKNOWN; ListingSuppressed when a cause holds). Lines resolve by `catalogItemId`, else by `gtin` through the catalogue's GTIN/packaging index; unresolvable lines and events without `received` are counted, never errors (ADR 0014)."
      contentType: application/cloudevents+json
      tags:
        - name: seller-inbound
      payload:
        $ref: "#/components/schemas/InboundShipmentReceivedIn"
      examples:
        - name: inboundShipmentReceived
          summary: A shipment received one resolved and one GTIN-only line.
          payload:
            specversion: "1.0"
            id: "3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1ca4"
            source: "/retailnetwork/seller-inbound"
            type: "com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived"
            subject: "shp-1"
            time: "2026-10-24T12:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:seller-inbound:events:InboundShipmentReceived:v1"
            data:
              shipmentId: "shp-1"
              sellerId: "S-1"
              nodeId: "n-1"
              status: "CLOSED"
              cartons:
                - sscc: "006141410000000012"
                  status: "RECEIVED"
              receivedAt: "2026-10-24T12:00:00Z"
              received:
                - catalogItemId: "item-1"
                  gtin: "00614141000012"
                  qtyEaches: 24
                - gtin: "00614141000036"
                  qtyEaches: 6

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string, const: /retailnetwork/offer-availability }
        type: { type: string }
        subject: { type: string, description: The aggregate root id (catalogItemId, listingId or feedId). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    Basis:
      type: string
      description: Why the node gave the number; kept as the vendor declared it, never re-derived.
      enum: [PHYSICAL, THROUGHPUT_CONSTRAINED, UNKNOWN]

    SuppressionReason:
      type: string
      description: The highest active cause, by precedence DISCONTINUED > NODE_NOT_SELLABLE > OWNER_SUSPENDED (ADR 0013).
      enum: [NODE_NOT_SELLABLE, DISCONTINUED, OWNER_SUSPENDED]

    CatalogItemCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [catalogItemId, title, lengthMm, widthMm, heightMm, weightG, hazmat, fragile]
              properties:
                catalogItemId: { type: string }
                title: { type: string }
                lengthMm: { type: integer, minimum: 1 }
                widthMm: { type: integer, minimum: 1 }
                heightMm: { type: integer, minimum: 1 }
                weightG: { type: integer, minimum: 1 }
                hazmat: { type: boolean }
                fragile: { type: boolean }
                gtin: { type: string, pattern: "^[0-9]{14}$", description: The optional identifiers.gtin, normalised to 14 digits; omitted when the item has none. }

    CatalogItemPackagingDeclaredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [catalogItemId, level, gtin, unitsPerPack, declaredAt]
              properties:
                catalogItemId: { type: string }
                level: { $ref: "#/components/schemas/PackLevel" }
                gtin: { type: string, pattern: "^[0-9]{14}$" }
                childGtin: { type: string, pattern: "^[0-9]{14}$", description: The GTIN of the active lower level; omitted for EACH. }
                unitsPerPack: { type: integer, minimum: 1, maximum: 1000000, description: Eaches in one pack; 1 for EACH. }
                declaredAt: { type: string, format: date-time }

    CatalogItemPackLevelRetiredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [catalogItemId, level, gtin, retiredAt]
              properties:
                catalogItemId: { type: string }
                level: { $ref: "#/components/schemas/PackLevel" }
                gtin: { type: string, pattern: "^[0-9]{14}$" }
                retiredAt: { type: string, format: date-time }

    PackLevel:
      type: string
      enum: [EACH, INNER, CASE, PALLET]
      description: Packaging level, lowest first.

    CatalogItemDiscontinuedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [catalogItemId]
              properties:
                catalogItemId: { type: string }

    ListingCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [listingId, catalogItemId, nodeId]
              properties:
                listingId: { type: string }
                catalogItemId: { type: string }
                nodeId: { type: string }
                ownerRef: { type: string, description: The owning seller (sellerId); omitted for an operator-owned listing. }

    ListingAvailabilityChangedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [listingId, catalogItemId, nodeId, availableQty, basis, asOf, feedId]
              properties:
                listingId: { type: string }
                catalogItemId: { type: string }
                nodeId: { type: string }
                ownerRef: { type: string, description: The owning seller (sellerId); omitted for an operator-owned listing. }
                availableQty: { type: integer, minimum: 0 }
                basis: { $ref: "#/components/schemas/Basis" }
                asOf: { type: string, format: date-time, description: The instant the number is true for; strictly increasing per listing. }
                feedId: { type: string, description: The feed that carried the number. }

    ListingSuppressedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [listingId, nodeId, reason]
              properties:
                listingId: { type: string }
                nodeId: { type: string }
                reason: { $ref: "#/components/schemas/SuppressionReason" }

    ListingRestoredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [listingId, nodeId]
              properties:
                listingId: { type: string }
                nodeId: { type: string }

    InventoryFeedAppliedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [feedId, nodeId, fullUpdate, lineCount, appliedAt]
              properties:
                feedId: { type: string }
                nodeId: { type: string }
                fullUpdate: { type: boolean }
                lineCount: { type: integer, minimum: 0, description: Lines in the feed as received. }
                appliedAt: { type: string, format: date-time }

    NodeRegisteredIn:
      type: object
      description: Tolerant copy of the node-topology NodeRegistered envelope; only the fields read are declared.
      required: [id, type, time, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.logistics.node-topology.node.NodeRegistered }
        time: { type: string, format: date-time }
        data:
          type: object
          required: [nodeId]
          properties:
            nodeId: { type: string }

    NodeActivatedIn:
      type: object
      description: Tolerant copy of the node-topology NodeActivated envelope; only the fields read are declared.
      required: [id, type, time, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.logistics.node-topology.node.NodeActivated }
        time: { type: string, format: date-time }
        data:
          type: object
          required: [nodeId, activatedAt]
          properties:
            nodeId: { type: string }
            activatedAt: { type: string, format: date-time }

    NodeSuspendedIn:
      type: object
      description: Tolerant copy of the node-topology NodeSuspended envelope; only the fields read are declared.
      required: [id, type, time, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.logistics.node-topology.node.NodeSuspended }
        time: { type: string, format: date-time }
        data:
          type: object
          required: [nodeId, suspendedAt]
          properties:
            nodeId: { type: string }
            suspendedAt: { type: string, format: date-time }

    NodeRetiredIn:
      type: object
      description: Tolerant copy of the node-topology NodeRetired envelope; only the fields read are declared.
      required: [id, type, time, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.logistics.node-topology.node.NodeRetired }
        time: { type: string, format: date-time }
        data:
          type: object
          required: [nodeId, retiredAt]
          properties:
            nodeId: { type: string }
            retiredAt: { type: string, format: date-time }

    SellerSuspendedIn:
      type: object
      description: Tolerant copy of the seller-inbound SellerSuspended envelope; only the fields read are declared (the producer's optional `reason` is not read).
      required: [id, type, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.partner.seller-inbound.seller.SellerSuspended }
        data:
          type: object
          required: [sellerId, suspendedAt]
          properties:
            sellerId: { type: string }
            suspendedAt: { type: string, format: date-time }

    SellerReinstatedIn:
      type: object
      description: Tolerant copy of the seller-inbound SellerReinstated envelope; only the fields read are declared.
      required: [id, type, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.partner.seller-inbound.seller.SellerReinstated }
        data:
          type: object
          required: [sellerId, reinstatedAt]
          properties:
            sellerId: { type: string }
            reinstatedAt: { type: string, format: date-time }

    InboundShipmentReceivedIn:
      type: object
      description: Tolerant copy of the seller-inbound InboundShipmentReceived envelope (seller-inbound ADR 0014); only the fields read are declared. `status`, `cartons` and `receivedAt` are not read.
      required: [id, type, data]
      properties:
        id: { type: string }
        type: { type: string, const: com.retailnetwork.partner.seller-inbound.inboundshipment.InboundShipmentReceived }
        data:
          type: object
          required: [sellerId, nodeId]
          properties:
            shipmentId: { type: string, description: Logged only. }
            sellerId: { type: string, description: The ownerRef of the listings created. }
            nodeId: { type: string }
            received:
              type: array
              description: The stock received per item, sorted by gtin, zero lines omitted. Absent on events published before seller-inbound ADR 0014, which create nothing (counted received_unknown).
              items:
                type: object
                required: [gtin, qtyEaches]
                properties:
                  catalogItemId: { type: string, description: Omitted when the producer could not resolve it; the line then resolves by gtin. }
                  gtin: { type: string, pattern: "^[0-9]{14}$", description: The EACH GTIN when the producer resolved it, otherwise the carton GTIN. }
                  qtyEaches: { type: integer, minimum: 1, description: A line is used when > 0; the quantity is never applied as availability. }
