asyncapi: 3.0.0

info:
  title: offer-availability Domain Events
  version: "1.0.0"
  contact:
    name: offer-availability maintainers
    url: https://github.com/IQVO/offer-availability
    email: offer-availability@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
    - name: offer-availability
      description: The offer-availability bounded context (retail network, commerce tier).
    - name: catalogitem
      description: Events raised by the CatalogItem aggregate.
    - name: listing
      description: Events raised by the Listing aggregate.
    - name: inventoryfeed
      description: Events raised by the InventoryFeed aggregate.
    - name: node-topology
      description: Events consumed from the node-topology bounded context.
    - name: seller-inbound
      description: Events consumed from the seller-inbound bounded context.
  description: |
    Event catalog for the **offer-availability** bounded context of the retail
    network (commerce tier): the network's catalogue items, one listing per
    (catalogue item, node) and the quantity each node claims it can ship, with
    the basis the vendor gave (ADR 0001, ADR 0002).

    **Published.** Nine events, all integration events on the topic
    `retailnetwork.offer-availability.events`, through a **transactional
    outbox**: the aggregates and their already-encoded events are written in ONE
    database transaction and an always-on relay drains them to Kafka
    (at-least-once; the CloudEvents `id` is stored with the outbox row, so a
    retry republishes the same `id`). The nine types are catalogued in ADR 0004.
    A listing created on a node that is not sellable raises ListingCreated and,
    in the same transaction, ListingSuppressed (ADR 0002, A6), so a consumer
    never has to guess the initial state.

    **Consumed.** Four node-topology events (`NodeRegistered`, `NodeActivated`,
    `NodeSuspended`, `NodeRetired`) from `retailnetwork.node-topology.events`,
    in the consumer group given by the mandatory `NODE_TOPOLOGY_CONSUMER_GROUP`
    (a boot error when unset). They feed the local NodeStatusView and
    drive the SuppressOnNodeUnavailable policy (ADR 0003). The consumer
    dispatches on the full `type`, ignores every other type, tolerates unknown
    fields, and dedupes on the CloudEvents `id` (inbox table `processed_events`).
    Two seller-inbound events (`SellerSuspended`, `SellerReinstated`) from
    `retailnetwork.seller-inbound.events`, in the consumer group given by the
    mandatory `SELLER_INBOUND_CONSUMER_GROUP`, feed the local SellerStatusView
    and suppress or restore the listings the seller owns (reason
    OWNER_SUSPENDED, ADR 0013). `InboundShipmentReceived` on the same topic
    creates the seller's listings of the received stock (ADR 0014). Every other
    type on that topic is acknowledged and counted
    (`availability.seller_events.ignored`, reason `type_not_consumed`), never
    applied.

    **Analytics.** The model names no analytics-only event for this context, so
    nothing is published on `retailnetwork.offer-availability.analytics`.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/offer-availability`), `type`,
    `subject` (the aggregate root id), `time`, `datacontenttype`
    (`application/json`) and `dataschema`
    (`urn:retailnetwork:offer-availability:events:<EventName>:v1`) are all
    required. Kafka key = the subject, so one aggregate's events stay ordered on
    one partition. Type =
    `com.retailnetwork.commerce.offer-availability.<entity>.<EventName>` with
    entity `catalogitem`, `listing` or `inventoryfeed`. A breaking payload
    change is a new `.v2` type, never a mutation. Dispatch on the full `type`,
    ignore unknown types, dedupe on `id`.

    **Conventions.** `data` is camelCase; ids are strings; timestamps are RFC
    3339 UTC; counts are integers; enums are UPPER_SNAKE; optional fields are
    omitted when unset (never null).

servers:
  production:
    host: "{brokers}"
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: "kafka.retail-network.internal:9092"

defaultContentType: application/cloudevents+json

channels:
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic
    description: |
      This service's integration topic. Written by the outbox relay; key =
      subject (catalogItemId, listingId or feedId). Every message carries the
      CloudEvents content-type header. Dispatch on the full `type`, ignore
      unknown types, dedupe on `id`.
    messages:
      CatalogItemCreated:
        $ref: "#/components/messages/CatalogItemCreated"
      CatalogItemDiscontinued:
        $ref: "#/components/messages/CatalogItemDiscontinued"
      CatalogItemPackagingDeclared:
        $ref: "#/components/messages/CatalogItemPackagingDeclared"
      CatalogItemPackLevelRetired:
        $ref: "#/components/messages/CatalogItemPackLevelRetired"
      ListingCreated:
        $ref: "#/components/messages/ListingCreated"
      ListingAvailabilityChanged:
        $ref: "#/components/messages/ListingAvailabilityChanged"
      ListingSuppressed:
        $ref: "#/components/messages/ListingSuppressed"
      ListingRestored:
        $ref: "#/components/messages/ListingRestored"
      InventoryFeedApplied:
        $ref: "#/components/messages/InventoryFeedApplied"
  nodeTopologyEvents:
    address: retailnetwork.node-topology.events
    title: node-topology integration topic (consumed)
    description: |
      Owned by node-topology; consumed here. Key = nodeId, so one node's events
      arrive in order on one partition. Only the four node lifecycle types below
      are used; every other type on the topic is acknowledged and ignored.
    messages:
      NodeRegistered:
        $ref: "#/components/messages/NodeRegistered"
      NodeActivated:
        $ref: "#/components/messages/NodeActivated"
      NodeSuspended:
        $ref: "#/components/messages/NodeSuspended"
      NodeRetired:
        $ref: "#/components/messages/NodeRetired"
  sellerInboundEvents:
    address: retailnetwork.seller-inbound.events
    title: seller-inbound integration topic (consumed)
    description: |
      Owned by seller-inbound; consumed here (ADR 0013). Key = the aggregate
      root id (sellerId for the two seller types below, shipmentId for
      InboundShipmentReceived), so one seller's status events arrive in order on
      one partition. The two seller status types and InboundShipmentReceived
      (ADR 0014) are used; every other type on the topic (the other inbound
      shipment events, the placement suggestion, any future type) is
      acknowledged, counted and ignored.
    messages:
      SellerSuspended:
        $ref: "#/components/messages/SellerSuspended"
      SellerReinstated:
        $ref: "#/components/messages/SellerReinstated"
      InboundShipmentReceived:
        $ref: "#/components/messages/InboundShipmentReceived"

operations:
  publishOfferAvailabilityEvents:
    action: send
    title: Publish offer-availability events
    summary: Publish the nine offer-availability events through the transactional outbox.
    description: |
      The service sends every event of its three aggregates (CatalogItem,
      Listing, InventoryFeed) to `retailnetwork.offer-availability.events`.
      Consumers route on the full `type`.
    tags:
      - name: offer-availability
    channel:
      $ref: "#/channels/offerAvailabilityEvents"
    messages:
      - $ref: "#/channels/offerAvailabilityEvents/messages/CatalogItemCreated"
      - $ref: "#/channels/offerAvailabilityEvents/messages/CatalogItemDiscontinued"
      - $ref: "#/channels/offerAvailabilityEvents/messages/CatalogItemPackagingDeclared"
      - $ref: "#/channels/offerAvailabilityEvents/messages/CatalogItemPackLevelRetired"
      - $ref: "#/channels/offerAvailabilityEvents/messages/ListingCreated"
      - $ref: "#/channels/offerAvailabilityEvents/messages/ListingAvailabilityChanged"
      - $ref: "#/channels/offerAvailabilityEvents/messages/ListingSuppressed"
      - $ref: "#/channels/offerAvailabilityEvents/messages/ListingRestored"
      - $ref: "#/channels/offerAvailabilityEvents/messages/InventoryFeedApplied"
  receiveNodeTopologyEvents:
    action: receive
    title: Receive node-topology node lifecycle events
    summary: Fold node status into NodeStatusView and apply SuppressOnNodeUnavailable.
    description: |
      Consumed from `retailnetwork.node-topology.events` in the group named by
      NODE_TOPOLOGY_CONSUMER_GROUP. NodeRegistered inserts the node as PROPOSED;
      NodeActivated sets it ACTIVE and restores the listings of the node that
      are suppressed for NODE_NOT_SELLABLE; NodeSuspended and NodeRetired set it
      SUSPENDED or RETIRED and suppress every LIVE listing of the node. The
      fields read are exactly the ones in the payload schemas below; everything
      else in the producer's payload is ignored. Each CloudEvents id is recorded
      in `processed_events` in the same transaction as its effects.

      Failure handling: a message that is not a valid CloudEvents 1.0 event is
      logged and skipped (offset committed); a node type of the four with an
      undecodable `data`, a missing `nodeId` or instant, or a value the use case
      refuses (validation) is dead-lettered at once; any other failure is tried
      5 times in all, then dead-lettered. The dead-letter topic is
      `retailnetwork.node-topology.events.dlq` (same key and value, headers
      `x-dlq-source-topic`, `x-dlq-source-partition`, `x-dlq-source-offset`,
      `x-dlq-error`, `x-dlq-failed-at`). Offsets are committed after the event
      was handled. The instant applied is `activatedAt`, `suspendedAt` or
      `retiredAt`; for NodeRegistered it is the CloudEvents `time`.
    tags:
      - name: node-topology
    channel:
      $ref: "#/channels/nodeTopologyEvents"
    messages:
      - $ref: "#/channels/nodeTopologyEvents/messages/NodeRegistered"
      - $ref: "#/channels/nodeTopologyEvents/messages/NodeActivated"
      - $ref: "#/channels/nodeTopologyEvents/messages/NodeSuspended"
      - $ref: "#/channels/nodeTopologyEvents/messages/NodeRetired"
  receiveSellerInboundEvents:
    action: receive
    title: Receive seller-inbound seller status events
    summary: Fold seller status into SellerStatusView and suppress or restore the seller's listings.
    description: |
      Consumed from `retailnetwork.seller-inbound.events` in the group named by
      SELLER_INBOUND_CONSUMER_GROUP (ADR 0013). SellerSuspended sets the seller
      SUSPENDED at `suspendedAt` and suppresses every LIVE listing whose ownerRef
      is the sellerId with reason OWNER_SUSPENDED (a listing already SUPPRESSED
      keeps its higher reason). SellerReinstated sets it ACTIVE at
      `reinstatedAt` and restores every listing of the seller suppressed for
      OWNER_SUSPENDED, unless its node is not sellable or its item is
      discontinued, in which case the reason switches to that cause (one
      ListingSuppressed). An event older than the stored `asOf` is ignored; an
      unknown seller is ACTIVE. The fields read are exactly the ones in the
      payload schemas below. Each CloudEvents id is recorded in
      `processed_events` in the same transaction as its effects.

      Failure handling mirrors the node-topology consumer: not a CloudEvent =
      logged and skipped; another type of the topic = counted and skipped; a
      seller type with an undecodable `data`, a missing `sellerId` or instant, or
      a value the use case refuses is dead-lettered at once to
      `retailnetwork.seller-inbound.events.dlq`; any other failure is tried 5
      times in all, then dead-lettered.
    tags:
      - name: seller-inbound
    channel:
      $ref: "#/channels/sellerInboundEvents"
    messages:
      - $ref: "#/channels/sellerInboundEvents/messages/SellerSuspended"
      - $ref: "#/channels/sellerInboundEvents/messages/SellerReinstated"
  receiveSellerInboundReceivedStock:
    action: receive
    title: Receive seller-inbound received shipments
    summary: Create the seller's listings of the stock an inbound shipment received.
    description: |
      Consumed from `retailnetwork.seller-inbound.events` by the same consumer
      and group as the seller status events (ADR 0014, building ADR 0013 rule
      8). For each `received` line with `qtyEaches` > 0 the item is the line's
      `catalogItemId`, or else the catalogue item holding its `gtin` (an item
      GTIN or any pack level GTIN, retired levels included). Each resolved item
      without a listing of (item, `nodeId`, ownerRef = `sellerId`) gets one:
      ListingCreated (availability 0, basis UNKNOWN), then ListingSuppressed when
      the node is not sellable, the item is discontinued or the owner is
      SUSPENDED. An existing listing is not touched; availability comes only
      from the vendor's inventory feed. One transaction per event, the
      CloudEvents id recorded in `processed_events`.

      Skips are acknowledged and counted in `availability.seller_events.ignored`
      (attribute `reason`), never errors: an event without `received`
      (published before the producer carried it) creates nothing
      (`received_unknown`); a line whose GTIN no item holds is logged at WARN
      (`gtin_unresolved`); a line whose `catalogItemId` the catalogue does not
      hold likewise (`item_unknown`). An undecodable `data`, or one without
      `sellerId` or `nodeId`, is dead-lettered to
      `retailnetwork.seller-inbound.events.dlq`.
    tags:
      - name: seller-inbound
    channel:
      $ref: "#/channels/sellerInboundEvents"
    messages:
      - $ref: "#/channels/sellerInboundEvents/messages/InboundShipmentReceived"

components:
  messages:
    CatalogItemCreated:
      name: CatalogItemCreated
      title: Catalogue item created
      summary: A catalogue item was created in state ACTIVE.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated`; subject and key = the catalogItemId. Raised by CreateCatalogItem. Dimensions are in millimetres and the weight in grams, all positive. `gtin` is the optional identifiers.gtin (14 digits, GS1 check digit validated) and is omitted when the item has none."
      contentType: application/cloudevents+json
      tags:
        - name: catalogitem
      payload:
        $ref: "#/components/schemas/CatalogItemCreatedEvent"
      examples:
        - name: catalogItemCreated
          summary: A catalogue item was created.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a10"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemCreated"
            subject: "item-004512"
            time: "2026-10-23T09:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:CatalogItemCreated:v1"
            data:
              catalogItemId: "item-004512"
              title: "Stainless steel water bottle 750 ml"
              lengthMm: 270
              widthMm: 75
              heightMm: 75
              weightG: 340
              hazmat: false
              fragile: false
              gtin: "06141410000120"

    CatalogItemPackagingDeclared:
      name: CatalogItemPackagingDeclared
      title: Catalogue item pack level declared
      summary: A pack level of a catalogue item was declared (or its dimensions changed in place).
      description: "`type` = `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackagingDeclared`; subject and key = the catalogItemId. Raised by DeclarePackLevel (ADR 0006). `unitsPerPack` is in eaches (1 for EACH); `childGtin` names the active lower level and is omitted for EACH. The unitsPerPack of a GTIN never changes: a new count arrives as a new `gtin` at the level, preceded in the same transaction by CatalogItemPackLevelRetired for the old one."
      contentType: application/cloudevents+json
      tags:
        - name: catalogitem
      payload:
        $ref: "#/components/schemas/CatalogItemPackagingDeclaredEvent"
      examples:
        - name: catalogItemPackagingDeclared
          summary: An inner pack of six eaches was declared.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a20"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackagingDeclared"
            subject: "item-004512"
            time: "2026-10-24T09:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:CatalogItemPackagingDeclared:v1"
            data:
              catalogItemId: "item-004512"
              level: "INNER"
              gtin: "06141410000298"
              childGtin: "06141410000120"
              unitsPerPack: 6
              declaredAt: "2026-10-24T09:00:00Z"

    CatalogItemPackLevelRetired:
      name: CatalogItemPackLevelRetired
      title: Catalogue item pack level retired
      summary: The active pack level of a catalogue item was retired.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackLevelRetired`; subject and key = the catalogItemId. Raised by RetirePackLevel, or by DeclarePackLevel when a new GTIN supersedes the level (then it precedes the CatalogItemPackagingDeclared of the new GTIN). The retired GTIN stays resolvable and is never reused."
      contentType: application/cloudevents+json
      tags:
        - name: catalogitem
      payload:
        $ref: "#/components/schemas/CatalogItemPackLevelRetiredEvent"
      examples:
        - name: catalogItemPackLevelRetired
          summary: The case level was retired.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a21"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemPackLevelRetired"
            subject: "item-004512"
            time: "2026-10-24T10:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:CatalogItemPackLevelRetired:v1"
            data:
              catalogItemId: "item-004512"
              level: "CASE"
              gtin: "06141410000366"
              retiredAt: "2026-10-24T10:00:00Z"

    CatalogItemDiscontinued:
      name: CatalogItemDiscontinued
      title: Catalogue item discontinued
      summary: A catalogue item moved from ACTIVE to DISCONTINUED.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued`; subject and key = the catalogItemId. Raised by DiscontinueItem. Every listing of the item is suppressed in the same transaction (reason DISCONTINUED), each with its own ListingSuppressed."
      contentType: application/cloudevents+json
      tags:
        - name: catalogitem
      payload:
        $ref: "#/components/schemas/CatalogItemDiscontinuedEvent"
      examples:
        - name: catalogItemDiscontinued
          summary: A catalogue item was discontinued.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a11"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.catalogitem.CatalogItemDiscontinued"
            subject: "item-004512"
            time: "2026-10-23T09:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:CatalogItemDiscontinued:v1"
            data:
              catalogItemId: "item-004512"

    ListingCreated:
      name: ListingCreated
      title: Listing created
      summary: A catalogue item is now offered from a node.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.listing.ListingCreated`; subject and key = the listingId. Raised by CreateListing. The event does not say whether the listing starts LIVE: a listing created on a node that is not sellable, or for a discontinued item, is followed in the same transaction by a ListingSuppressed. Availability starts at 0 with basis UNKNOWN until the first feed."
      contentType: application/cloudevents+json
      tags:
        - name: listing
      payload:
        $ref: "#/components/schemas/ListingCreatedEvent"
      examples:
        - name: listingCreated
          summary: A listing was created.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a12"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.listing.ListingCreated"
            subject: "lst-000184"
            time: "2026-10-23T09:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:ListingCreated:v1"
            data:
              listingId: "lst-000184"
              catalogItemId: "item-004512"
              nodeId: "node-0f3a91"

    ListingAvailabilityChanged:
      name: ListingAvailabilityChanged
      title: Listing availability changed
      summary: A feed replaced the available quantity of a listing.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.listing.ListingAvailabilityChanged`; subject and key = the listingId. Raised once per feed line that was applied and once per listing zeroed by FullFeedZeroing (a zeroed listing keeps its basis and gets the feed's asOf). `asOf` is strictly increasing per listing, so a consumer keeps the highest. Raised for a SUPPRESSED listing too: the state is carried by ListingSuppressed/ListingRestored, not here."
      contentType: application/cloudevents+json
      tags:
        - name: listing
      payload:
        $ref: "#/components/schemas/ListingAvailabilityChangedEvent"
      examples:
        - name: listingAvailabilityChanged
          summary: A feed replaced the quantity of a listing.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a13"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.listing.ListingAvailabilityChanged"
            subject: "lst-000184"
            time: "2026-10-23T14:05:12Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:ListingAvailabilityChanged:v1"
            data:
              listingId: "lst-000184"
              catalogItemId: "item-004512"
              nodeId: "node-0f3a91"
              availableQty: 120
              basis: THROUGHPUT_CONSTRAINED
              asOf: "2026-10-23T14:00:00Z"
              feedId: "feed-20261023-0007"

    ListingSuppressed:
      name: ListingSuppressed
      title: Listing suppressed
      summary: A listing stopped being sellable.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.listing.ListingSuppressed`; subject and key = the listingId. Raised by SuppressListing: on NodeSuspended/NodeRetired (reason NODE_NOT_SELLABLE), on SellerSuspended for the seller's LIVE listings (OWNER_SUSPENDED), on creation for a node that is not sellable (NODE_NOT_SELLABLE), a discontinued item (DISCONTINUED) or a suspended owner (OWNER_SUSPENDED), and on DiscontinueItem (DISCONTINUED). `reason` is the highest active cause, by precedence DISCONTINUED > NODE_NOT_SELLABLE > OWNER_SUSPENDED (ADR 0013): whenever it changes (a higher cause arrives, or a cleared higher cause hands over to a remaining lower one, for example NodeActivated while the owner is still suspended) a second ListingSuppressed carries the new reason. DISCONTINUED is final."
      contentType: application/cloudevents+json
      tags:
        - name: listing
      payload:
        $ref: "#/components/schemas/ListingSuppressedEvent"
      examples:
        - name: listingSuppressed
          summary: A listing was suppressed because its node was suspended.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a14"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.listing.ListingSuppressed"
            subject: "lst-000184"
            time: "2026-10-23T15:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:ListingSuppressed:v1"
            data:
              listingId: "lst-000184"
              nodeId: "node-0f3a91"
              reason: NODE_NOT_SELLABLE

    ListingRestored:
      name: ListingRestored
      title: Listing restored
      summary: A suppressed listing became LIVE again.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.listing.ListingRestored`; subject and key = the listingId. Raised by RestoreListing when the last cause cleared: the node became ACTIVE again (NODE_NOT_SELLABLE) or the owner was reinstated (OWNER_SUSPENDED), and no other cause holds. A listing suppressed for DISCONTINUED is never restored."
      contentType: application/cloudevents+json
      tags:
        - name: listing
      payload:
        $ref: "#/components/schemas/ListingRestoredEvent"
      examples:
        - name: listingRestored
          summary: A listing was restored because its node was activated.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a15"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.listing.ListingRestored"
            subject: "lst-000184"
            time: "2026-10-23T16:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:ListingRestored:v1"
            data:
              listingId: "lst-000184"
              nodeId: "node-0f3a91"

    InventoryFeedApplied:
      name: InventoryFeedApplied
      title: Inventory feed applied
      summary: A vendor inventory feed reached APPLIED.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.inventoryfeed.InventoryFeedApplied`; subject and key = the feedId. Raised once by ApplyInventoryFeed when the feed reaches APPLIED, after the ListingAvailabilityChanged events of the same transaction. A FAILED or SUPERSEDED feed raises nothing. `lineCount` is the number of lines as received."
      contentType: application/cloudevents+json
      tags:
        - name: inventoryfeed
      payload:
        $ref: "#/components/schemas/InventoryFeedAppliedEvent"
      examples:
        - name: inventoryFeedApplied
          summary: A full feed was applied.
          payload:
            specversion: "1.0"
            id: "7c1d3a52-5f0e-4a61-9a37-2b9d4e1f6a16"
            source: "/retailnetwork/offer-availability"
            type: "com.retailnetwork.commerce.offer-availability.inventoryfeed.InventoryFeedApplied"
            subject: "feed-20261023-0007"
            time: "2026-10-23T14:05:12Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:offer-availability:events:InventoryFeedApplied:v1"
            data:
              feedId: "feed-20261023-0007"
