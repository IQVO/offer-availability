    NodeRetired:
      name: NodeRetired
      title: Node retired (consumed)
      summary: node-topology retired a node.
      description: "Consumed. `type` = `com.retailnetwork.logistics.node-topology.node.NodeRetired`. Sets the node RETIRED (terminal) in NodeStatusView at `retiredAt`, then suppresses every LIVE listing of the node (reason NODE_NOT_SELLABLE)."
      contentType: application/cloudevents+json
      tags:
        - name: node-topology
      payload:
        $ref: "#/components/schemas/NodeRetiredIn"
      examples:
        - name: nodeRetired
