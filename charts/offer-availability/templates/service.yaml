apiVersion: v1
kind: Service
metadata:
  name: {{ include "offer-availability.fullname" . }}
  labels:
    {{- include "offer-availability.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api pins this Service to the api pods (tests/test_service_selectors.py).
  selector:
    {{- include "offer-availability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
